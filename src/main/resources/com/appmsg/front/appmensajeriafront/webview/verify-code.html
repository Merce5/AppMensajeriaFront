<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" type="text/css" href="css/base.css">
</head>

<body>
<div class="auth-wrap">
    <div class="auth-card login-box">
        <button class="back-btn" onclick="Login.goRegister()" title="Volver">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M15 18l-6-6 6-6"/>
            </svg>
        </button>
        <h2>Verificación de email</h2>
        <p class="muted" style="margin: 0 0 12px 0;">Revisa tu correo para continuar. Probablemente haya entrado en spam</p>

        <form class="field" onsubmit="Login.verifyRegister(); return false;">
            <label for="code">Código de verificación</label>
            <input class="input" type="text" id="code" placeholder="Código">
            <small id="code-error" class="error-text" style="display:none;"></small>

            <div class="auth-actions">
                <div id="error-card"></div>

                <div class="verify-actions">
                    <button class="btn btn-primary" type="submit">
                        Registrarse
                    </button>

                    <button class="btn-refresh" type="button" onclick="Login.resendCode()" title="Reenviar código">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 2v6h-6"/>
                            <path d="M3 12a9 9 0 0115-6.7L21 8"/>
                            <path d="M3 22v-6h6"/>
                            <path d="M21 12a9 9 0 01-15 6.7L3 16"/>
                        </svg>
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>

<script type="text/javascript" src="js/bridge.js"></script>
<script type="text/javascript" src="js/login.js"></script>
<script>
Bridge.whenReady(() => {
    if (window.javaBridge && typeof javaBridge.loadSettings === "function") {
        javaBridge.loadSettings();
    }
});
function onSettingsLoaded(dto) {
    if (dto) {
        Utils.applyTheme(dto);
    }
}
</script>
</body>
</html>

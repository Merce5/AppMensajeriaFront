<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Chat - AppMensajería</title>

    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/chat.css" />
</head>

<body>
    <div class="chat-container" id="chat-main-container">
        <!-- Header del chat -->
        <header class="chat-header">
            <button class="btn-icon" onclick="Bridge.goBack()" title="Volver">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
            </button>

            <div class="chat-info" onclick="Chat.openSettings()" title="Ver info del chat">
                <img id="chat-avatar" class="avatar" src="" alt="" onerror="this.style.display='none'">
                <div id="chat-avatar-placeholder" class="avatar avatar-placeholder" style="display:none">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="22" height="22">
                        <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                </div>
                <div class="chat-info-text">
                    <span id="chat-name" class="chat-name">Chat</span>
                    <span id="chat-status" class="chat-status">Conectando...</span>
                </div>
            </div>

            <button class="btn-icon" onclick="Chat.openSettings()" title="Info del chat" style="margin-left:auto">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="12" y1="8" x2="12" y2="12"/>
                    <line x1="12" y1="16" x2="12.01" y2="16"/>
                </svg>
            </button>
        </header>

        <!-- Lista de mensajes -->
        <main class="messages-container" id="messages">
            <div class="empty-chat" id="empty-state">
                <svg class="empty-chat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
                </svg>
                <p>No hay mensajes aun</p>
            </div>
        </main>

        <!-- Indicador de typing -->
        <div id="typing-indicator" class="typing-indicator hidden">
            <span id="typing-user"></span> esta escribiendo
            <span class="typing-dots">
                <span></span>
                <span></span>
                <span></span>
            </span>
        </div>

        <!-- Barra de input -->
        <footer class="input-bar">
            <div id="attachments-preview" class="attachments-preview hidden"></div>

            <div class="input-row">
                <button class="btn-icon" onclick="Chat.openFilePicker()" title="Adjuntar archivo">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/>
                    </svg>
                </button>

                <input type="text"
                       id="message-input"
                       placeholder="Escribe un mensaje..."
                       autocomplete="off"
                       onkeyup="Chat.handleTyping(event)"
                       onkeydown="Chat.handleKeyPress(event)">

                <button class="btn-send" onclick="Chat.sendMessage()" title="Enviar">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                    </svg>
                </button>
            </div>
        </footer>
    </div>

    <!-- Panel de configuración del chat -->
    <div id="settings-panel" class="settings-panel hidden">
        <div class="settings-panel-header">
            <button class="btn-icon" onclick="Chat.closeSettings()" title="Cerrar">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
            </button>
            <h2 class="settings-panel-title">Info del chat</h2>
        </div>

        <!-- Avatar del grupo con opción de cambio -->
        <div class="settings-avatar-section">
            <div class="settings-avatar-wrapper" onclick="Chat.changeGroupImage()" title="Cambiar foto">
                <img id="settings-avatar-img" class="settings-avatar-img" src="" alt="" onerror="this.style.display='none'">
                <div id="settings-avatar-placeholder" class="settings-avatar-placeholder">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="40" height="40">
                        <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/>
                        <circle cx="9" cy="7" r="4"/>
                        <path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/>
                    </svg>
                </div>
                <div class="settings-avatar-overlay">
                    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" width="22" height="22">
                        <path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/>
                        <circle cx="12" cy="13" r="4"/>
                    </svg>
                </div>
            </div>
            <div class="settings-avatar-name" id="settings-display-name">Chat</div>
            <div class="settings-avatar-desc" id="settings-display-desc" style="display:none"></div>
        </div>

        <!-- Descripción del grupo — SIEMPRE VISIBLE -->
        <div class="settings-section">
            <div class="settings-section-title">Descripción</div>
            <textarea id="settings-desc-textarea" class="settings-textarea"
                      placeholder="Añade una descripción al grupo...&#10;Ej: Equipo de trabajo, proyecto final, reuniones de equipo..."
                      rows="3"></textarea>
            <button class="settings-save-btn settings-save-btn-full" onclick="Chat.saveGroupStatus()">
                Guardar descripción
            </button>
        </div>

        <!-- Nombre del grupo (solo grupos) -->
        <div class="settings-section" id="settings-edit-section">
            <div class="settings-section-title">Configuración del grupo</div>
            <div class="settings-field">
                <label class="settings-label">Nombre del grupo</label>
                <div class="settings-input-row">
                    <input id="settings-name-input" class="settings-input" type="text" placeholder="Nombre del grupo">
                    <button class="settings-save-btn" onclick="Chat.saveGroupName()">Guardar</button>
                </div>
            </div>
        </div>

        <!-- Participantes -->
        <div class="settings-section">
            <div class="settings-section-title">
                Participantes (<span id="settings-members-count">0</span>)
            </div>
            <div id="settings-members-list" class="settings-members-list"></div>
            <div class="settings-add-member" id="settings-add-member">
                <input id="add-member-input" class="settings-input" type="text" placeholder="Añadir por nombre de usuario...">
                <button class="settings-save-btn" onclick="Chat.addMember()">Añadir</button>
            </div>
        </div>

        <!-- Multimedia compartida -->
        <div class="settings-section">
            <div class="settings-section-title">Multimedia compartida</div>
            <div id="settings-media-gallery" class="media-gallery">
                <div class="media-gallery-empty">No hay multimedia compartida</div>
            </div>
        </div>
    </div>

    <script src="js/bridge.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/chat.js"></script>
    <script>
    Bridge.whenReady(() => {
        if (window.javaBridge && typeof javaBridge.loadSettings === "function") {
            javaBridge.loadSettings();
        }
    });
    window.Chat = Chat;

    function onSettingsLoaded(dto) {
        if (dto) {
            Utils.applyTheme(dto);
        }
        const container = document.getElementById('chat-main-container');
        container.classList.remove('force-red-bg', 'wallpaper-custom');
        let styleTag = document.getElementById('wallpaper-style');
        if (!styleTag) {
            styleTag = document.createElement('style');
            styleTag.id = 'wallpaper-style';
            document.head.appendChild(styleTag);
        }
        if (dto && dto.wallpaperPath) {
            container.classList.add('wallpaper-custom');
            styleTag.textContent = `.chat-container.wallpaper-custom { background: url('${dto.wallpaperPath}') center center / cover no-repeat fixed !important; }`;
        } else {
            styleTag.textContent = '';
        }
    }
    </script>
</body>
</html>
